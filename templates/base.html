<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=430, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
          crossorigin="anonymous">
    <title>Пазл</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        width: 430px;
        height: 800px;
        margin: 0 auto;
        background: #f0f0f0;
        overflow: hidden;
      }

      body {
        width: 430px;
        height: 800px;
        margin: 0;
        padding: 10px;
        background: #fff;
        border: 3px solid #3b82f6;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      nav a {
        color: #d64161;
        font-size: 1.2em;
        margin-left: 10px;
        text-decoration: none;
      }

      nav {
        margin-bottom: 5px;
        flex-shrink: 0;
      }

      hr {
        margin: 5px 0;
        flex-shrink: 0;
      }

      .content {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 10px;
      }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <header>
        <nav class="navbar navbar-light bg-light">
            <a class="navbar-brand" href="#">Осетинская мозаика</a>
            {% if not current_user.is_authenticated %}
            <a class="navbar-brand" href="#">{{ current_user.name }}</a>
            <a class="btn btn-outline-info btn-sm" href="/my_mosaics">Мои мозаики</a>
            <a class="btn btn-success" href="/logout">Выйти</a>
            {% else %}
            <p>
                <a class="btn btn-primary " href="/register">Зарегистрироваться</a>
                <a class="btn btn-success" href="/login">Войти</a>
            </p>
            {% endif %}
        </nav>
    </header>
    <hr />
    <div class="content">{% block content %} {% endblock %}</div>
  </body>
</html>
