{% extends "base.html" %}

{% block head %}
{{ super() }}
<title>Уровень 2</title>
<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>

<style>
    .puzzle-wrapper {
        background: rgba(255, 255, 255, 0.95);
        padding: 10px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        display: flex;
        justify-content: center;
        align-items: center;
        width: fit-content;
        margin: 0 auto;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.3);
    }

    .puzzle-grid {
        display: grid;
        grid-template-columns: repeat(3, 200px);
        grid-template-rows: repeat(3, 200px);
        gap: 10px;
    }

    .cell {
        border: 2px dashed rgba(173, 181, 189, 0.8);
        background: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }

    .cell.drag-over {
        background: rgba(102, 126, 234, 0.15);
        border-style: solid;
        border-color: #667eea;
    }

    .cell img {
        max-width: 100%;
        max-height: 100%;
        cursor: grab;
        border-radius: 6px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        user-select: none;
        transition: transform 0.15s ease;
    }

    .cell img:active {
        cursor: grabbing;
        transform: scale(1.03);
    }

    .cell img[draggable="false"] {
        cursor: default;
        opacity: 0.95;
    }

    .timer-display {
        font-size: 1.15rem;
        font-weight: 700;
        color: #374151;
        background: white;
        padding: 0.4rem 0.9rem;
        border-radius: 0.75rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        min-width: 85px;
        text-align: center;
        transition: all 0.3s ease;
    }
    
    .timer-display.finished {
        color: #065f46;
        background: linear-gradient(135deg, #d1fae5, #a7f3d0);
        box-shadow: 0 0 0 2px #10b981, 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-home {
        margin-left: 8px;
        background: white;
        border: 2px solid #e5e7eb;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 0.5rem;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        cursor: pointer;
    }

    .btn-home:hover {
        background: #f9fafb;
        border-color: #667eea;
        transform: translateY(-1px);
    }

    .btn-finish {
        margin-top: 12px;
        width: 100%;
        max-width: 320px;
        padding: 0.7rem;
        background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        color: white;
        border: none;
        border-radius: 0.875rem;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 4px 14px rgba(251, 191, 36, 0.35);
        transition: all 0.25s ease;
        cursor: pointer;
    }

    .btn-finish:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 20px rgba(251, 191, 36, 0.5);
    }

    .btn-finish:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .level-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        padding: 0 4px;
        width: 100%;
        max-width: 430px;
        box-sizing: border-box;
    }

    .level-title {
        font-size: 1.25rem;
        font-weight: 800;
        color: white;
        margin: 0;
        text-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }

    .custom-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.25s ease;
        padding: 1rem;
    }

    .custom-modal.show {
        opacity: 1;
        visibility: visible;
    }

    .custom-modal-content {
        background: white;
        border-radius: 1.25rem;
        padding: 1.5rem 1.25rem;
        max-width: 320px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        transform: scale(0.95);
        transition: transform 0.25s ease;
        border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .custom-modal.show .custom-modal-content {
        transform: scale(1);
    }

    .modal-icon {
        font-size: 3rem;
        margin-bottom: 0.5rem;
        animation: bounce 0.6s ease;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .modal-title {
        font-size: 1.4rem;
        font-weight: 800;
        color: #065f46;
        margin: 0 0 0.5rem;
    }

    .modal-text {
        color: #6b7280;
        margin: 0 0 0.25rem;
        font-size: 0.95rem;
    }

    .modal-time {
        font-size: 1.25rem;
        font-weight: 700;
        color: #059669;
        margin: 0.75rem 0 1.25rem;
    }

    .modal-btn {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .modal-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 20px rgba(16, 185, 129, 0.5);
    }



</style>
{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; width: 100%; padding-top: 0.5rem;">

    <div class="level-header">
        <h2 class="level-title">🧩 Уровень 2</h2>
        <div class="d-flex align-items-center gap-2">
            <span id="timer" class="timer-display">00:00</span>
            <button id="btnHome" class="btn-home" onclick="goToIndex()" style="display: none;" title="На главную">
                🏠
            </button>
        </div>
    </div>

    <div class="puzzle-wrapper">
        <div class="puzzle-grid">
            <div class="cell" data-pos="0" ondrop="drop(event)" ondragover="allowDrop(event)"
                 ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
            <div class="cell" data-pos="1" ondrop="drop(event)" ondragover="allowDrop(event)"
                 ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
            <div class="cell" data-pos="2" ondrop="drop(event)" ondragover="allowDrop(event)"
                 ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
            <div class="cell" data-pos="3" ondrop="drop(event)" ondragover="allowDrop(event)"
                 ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
            <div class="cell" data-pos="4" ondrop="drop(event)" ondragover="allowDrop(event)"
                 ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
            <div class="cell" data-pos="5" ondrop="drop(event)" ondragover="allowDrop(event)"
                 ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
            <div class="cell" data-pos="6" ondrop="drop(event)" ondragover="allowDrop(event)"
                 ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
            <div class="cell" data-pos="7" ondrop="drop(event)" ondragover="allowDrop(event)"
                 ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
            <div class="cell" data-pos="8" ondrop="drop(event)" ondragover="allowDrop(event)"
                 ondragenter="dragEnter(event)" ondragleave="dragLeave(event)"></div>
        </div>
    </div>

    <button id="btnFinish" class="btn-finish" onclick="goToIndex()">
        ✅ Завершить уровень
    </button>
</div>

<div id="hiddenImages" style="display: none;">
    <img src="{{ url_for('static', filename='images/level2/1.png') }}" data-num="1" id="img1" draggable="true"
         ondragstart="drag(event)">
    <img src="{{ url_for('static', filename='images/level2/2.png') }}" data-num="2" id="img2" draggable="true"
         ondragstart="drag(event)">
    <img src="{{ url_for('static', filename='images/level2/3.png') }}" data-num="3" id="img3" draggable="true"
         ondragstart="drag(event)">
    <img src="{{ url_for('static', filename='images/level2/4.png') }}" data-num="4" id="img4" draggable="true"
         ondragstart="drag(event)">
    <img src="{{ url_for('static', filename='images/level2/5.png') }}" data-num="5" id="img5" draggable="true"
         ondragstart="drag(event)">
    <img src="{{ url_for('static', filename='images/level2/6.png') }}" data-num="6" id="img6" draggable="true"
         ondragstart="drag(event)">
    <img src="{{ url_for('static', filename='images/level2/7.png') }}" data-num="7" id="img7" draggable="true"
         ondragstart="drag(event)">
    <img src="{{ url_for('static', filename='images/level2/8.png') }}" data-num="8" id="img8" draggable="true"
         ondragstart="drag(event)">
    <img src="{{ url_for('static', filename='images/level2/9.png') }}" data-num="9" id="img9" draggable="true"
         ondragstart="drag(event)">
</div>

<div id="winModal" class="custom-modal" onclick="handleModalClick(event)">
    <div class="custom-modal-content">
        <div class="modal-icon">🎉</div>
        <h3 class="modal-title">Вы выиграли!</h3>
        <p class="modal-text">Пазл 3×3 собран верно</p>
        <p class="modal-time">⏱️ Время: <span id="finalTime">--:--</span></p>
        <button class="modal-btn" onclick="closeWinModal()">
            Продолжить →
        </button>
    </div>
</div>

<script>
    let timerInterval = null;
    let startTime = null;
    let gameFinished = false;

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function startTimer() {
        startTime = Date.now();
        timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('timer').textContent = formatTime(elapsed);
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        return Math.floor((Date.now() - startTime) / 1000);
    }

    function allowDrop(ev) {
        if (gameFinished) return;
        ev.preventDefault();
    }

    function dragEnter(ev) {
        if (gameFinished) return;
        ev.preventDefault();
        const cell = ev.target.closest('.cell');
        if (cell) cell.classList.add('drag-over');
    }

    function dragLeave(ev) {
        const cell = ev.target.closest('.cell');
        if (cell) cell.classList.remove('drag-over');
    }

    function drag(ev) {
        if (gameFinished) return;
        ev.dataTransfer.setData("id", ev.target.id);
        ev.dataTransfer.effectAllowed = "move";
    }

    function drop(ev) {
        if (gameFinished) return;
        ev.preventDefault();

        const cell = ev.target.closest('.cell');
        if (cell) cell.classList.remove('drag-over');

        const draggedId = ev.dataTransfer.getData("id");
        const draggedEl = document.getElementById(draggedId);
        let targetCell = ev.target.closest('.cell');

        if (!targetCell || !draggedEl) return;

        const existingImg = targetCell.querySelector("img");
        const originCell = draggedEl.parentNode;

        if (existingImg && existingImg !== draggedEl) {
            originCell.appendChild(existingImg);
            targetCell.appendChild(draggedEl);
        } else if (!existingImg) {
            targetCell.appendChild(draggedEl);
        }

        if (checkWin()) {
            onWin();
        }
    }

    function getState() {
        const cells = document.querySelectorAll(".cell");
        let state = [];
        cells.forEach(cell => {
            const img = cell.querySelector("img");
            state.push(img ? Number(img.dataset.num) : null);
        });
        return state;
    }

    function isWinningState(state) {
        const wins = [
            [1, 2, 3, 4, 5, 6, 7, 8, 9],
            [2, 3, 1, 5, 6, 4, 8, 9, 7],
            [3, 1, 2, 6, 4, 5, 9, 7, 8],
            [4, 5, 6, 7, 8, 9, 1, 2, 3],
            [5, 6, 4, 8, 9, 7, 2, 3, 1],
            [6, 4, 5, 9, 7, 8, 3, 1, 2],
            [7, 8, 9, 1, 2, 3, 4, 5, 6],
            [8, 9, 7, 2, 3, 1, 5, 6, 4],
            [9, 7, 8, 3, 1, 2, 6, 4, 5]
        ];
        return wins.some(w => w.every((val, i) => val === state[i]));
    }

    function checkWin() {
        return isWinningState(getState());
    }

    function onWin() {
        gameFinished = true;
        const time = stopTimer();

        document.getElementById('timer').classList.add('finished');
        document.getElementById('timer').textContent = '🏆 ' + formatTime(time);

        document.querySelectorAll(".cell img").forEach(img => {
            img.setAttribute("draggable", "false");
        });
        document.querySelectorAll(".cell").forEach(cell => {
            cell.style.pointerEvents = "none";
        });

        document.getElementById("btnHome").style.display = "flex";
        document.getElementById("btnFinish").style.display = "none";

        document.getElementById('finalTime').textContent = formatTime(time);
        document.getElementById('winModal').classList.add('show');
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    function initGame() {
        const cells = document.querySelectorAll(".cell");
        const images = Array.from(document.querySelectorAll("#hiddenImages img"));

        let attempts = 0;
        let isWin = true;

        while (isWin && attempts < 1000) {
            shuffle(images);
            cells.forEach((cell, i) => {
                cell.innerHTML = "";
                cell.appendChild(images[i].cloneNode(true));
            });
            isWin = isWinningState(getState());
            attempts++;
        }

        cells.forEach((cell, i) => {
            cell.innerHTML = "";
            cell.appendChild(images[i]);
        });

        startTimer();
    }

    function closeWinModal() {
        const modal = document.getElementById('winModal');
        modal.classList.remove('show');
        
        setTimeout(() => {
            modal.style.display = 'none';
        }, 250);
    }
    
    function handleModalClick(event) {
        if (event.target.id === 'winModal') {
            closeWinModal();
        }
    }

    function goToIndex() {
        window.location.href = "/index";
    }

    document.addEventListener('DOMContentLoaded', initGame);



</script>
{% endblock %}
