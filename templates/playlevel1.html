<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Уровень</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-top: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 200px);
            grid-template-rows: repeat(2, 200px);
            gap: 15px;
            margin-top: 30px;
        }

        .cell {
            border: 2px dashed #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell img {
            max-width: 100%;
            max-height: 100%;
            cursor: grab;
        }
    </style>
</head>
<body>

<h2>Уровень 1</h2>

<div class="grid">
    <div class="cell" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="{{ url_for('static', filename='images/image1.png') }}" id="img1" draggable="true" ondragstart="drag(event)">
    </div>
    <div class="cell" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="{{ url_for('static', filename='images/image2.png') }}" id="img2" draggable="true" ondragstart="drag(event)">
    </div>
    <div class="cell" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="{{ url_for('static', filename='images/image3.png') }}" id="img3" draggable="true" ondragstart="drag(event)">
    </div>
    <div class="cell" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="{{ url_for('static', filename='images/image4.png') }}" id="img4" draggable="true" ondragstart="drag(event)">
    </div>
</div>

<script>
function allowDrop(ev) {
    ev.preventDefault();
}

function drag(ev) {
    ev.dataTransfer.setData("id", ev.target.id);
}

function drop(ev) {
    ev.preventDefault();

    const draggedId = ev.dataTransfer.getData("id");
    const draggedEl = document.getElementById(draggedId);

    let targetCell = ev.target;

    // если кинули на картинку — берем её контейнер
    if (targetCell.tagName === "IMG") {
        targetCell = targetCell.parentNode;
    }

    const existingImg = targetCell.querySelector("img");

    if (existingImg) {
        // меняем местами
        const originCell = draggedEl.parentNode;
        originCell.appendChild(existingImg);
    }

    targetCell.appendChild(draggedEl);
}
</script>

</body>
</html>
