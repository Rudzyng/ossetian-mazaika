{% extends "base.html" %}

{% block head %}
{{ super() }}
<style>
    .create-form {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 1rem;
        padding: 1.5rem;
        max-width: 800px;
        margin: 0 auto;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #374151;
    }

    .form-control {
        width: 100%;
        padding: 0.75rem;
        border: 2px solid #e5e7eb;
        border-radius: 0.5rem;
        font-size: 1rem;
    }

    .form-control:focus {
        outline: none;
        border-color: #667eea;
    }

    .size-selector {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
    }

    .size-btn {
        flex: 1;
        padding: 0.75rem;
        background: #f3f4f6;
        border: 2px solid #e5e7eb;
        border-radius: 0.5rem;
        cursor: pointer;
        text-align: center;
        font-weight: 600;
    }

    .size-btn.active {
        background: #667eea;
        border-color: #667eea;
        color: white;
    }

    .items-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
        max-height: 500px;
        overflow-y: auto;
        padding: 0.5rem;
    }

    .item-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 0.75rem;
        padding: 1rem;
    }

    .item-card label {
        font-size: 0.8rem;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 0.25rem;
        display: block;
    }

    .item-card input {
        width: 100%;
        margin-bottom: 0.75rem;
        padding: 0.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
    }

    .item-card input[type="file"] {
        padding: 0.25rem;
    }

    .btn-submit {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 0.75rem;
        font-weight: bold;
        cursor: pointer;
        font-size: 1rem;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
    }

    .help-text {
        font-size: 0.8rem;
        color: #6b7280;
        margin-top: 0.25rem;
    }

    .info-badge {
        background: #dbeafe;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        font-size: 0.85rem;
        color: #1e40af;
    }
</style>
{% endblock %}

{% block content %}
<div class="create-form">
    <h2 style="text-align: center; margin-bottom: 1rem;">🎨 Создание нового уровня</h2>

    <div class="info-badge">
        💡 Для создания уровня нужно загрузить пары "картинка + слово". Количество пар = размер пазла × 2
    </div>

    <form method="POST" enctype="multipart/form-data" id="createForm">
        <div class="form-group">
            <label>Название уровня:</label>
            <input type="text" name="level_name" class="form-control" required placeholder="例如: Цӕрӕгойтӕ">
        </div>

        <div class="form-group">
            <label>Размер пазла:</label>
            <div class="size-selector">
                <div class="size-btn" data-size="2">2×2 (4 части)</div>
                <div class="size-btn" data-size="3">3×3 (9 частей)</div>
                <div class="size-btn" data-size="4">4×4 (16 частей)</div>
            </div>
            <input type="hidden" name="grid_size" id="grid_size" value="2">
        </div>

        <div id="items-container" class="items-grid"></div>

        <div style="text-align: center; margin-top: 1.5rem;">
            <button type="submit" class="btn-submit">✨ Создать уровень</button>
        </div>
    </form>
</div>

<script>
    let currentSize = 2;

    // Выбор размера
    document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSize = parseInt(btn.dataset.size);
            document.getElementById('grid_size').value = currentSize;
            generateItems();
        });
    });

    // Генерация полей для элементов
    function generateItems() {
        const totalParts = currentSize * currentSize;
        const totalPairs = totalParts * 2;  // на каждую часть 2 элемента (картинка + слово)

        const container = document.getElementById('items-container');
        container.innerHTML = '';

        for (let i = 0; i < totalPairs; i++) {
            const pairHtml = `
                <div class="item-card">
                    <span style="font-size: 0.75rem; color: #667eea; display: block; margin-bottom: 0.5rem;">Элемент ${i+1} из ${totalPairs}</span>
                    <label>🖼️ Картинка</label>
                    <input type="file" name="image_${i}" accept="image/*" required>
                    <label>📖 Слово на осетинском</label>
                    <input type="text" name="word_${i}" placeholder="例如: гæды" required>
                </div>
            `;
            container.innerHTML += pairHtml;
        }
    }

    document.addEventListener('DOMContentLoaded', generateItems);
</script>
{% endblock %}
